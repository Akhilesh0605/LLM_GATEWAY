services:
  app:
    build: .
    container_name: llm-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_SERVER_LINK=redis://redis:6379
      - POSTGRESQL_LINK=postgresql+asyncpg://user:password@postgres:5432/llmgateway
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    container_name: llm-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    container_name: llm-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: llmgateway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: